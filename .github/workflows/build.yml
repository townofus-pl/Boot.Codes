# Builds Boot.Codes.dll and runs the tests.
# Starts on each push, on each pull request, and by hand (Actions -> Build -> Run workflow).
# The DLL is in the run's "Boot.Codes" artifact.
#
# A pushed tag v<version> (for example v1.1.0) also makes a GitHub release with the DLL.
# The tag sets the DLL version, so the tag and the version in the Impostor log are the same.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Boot.Codes.Tests

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            dotnet build Boot.Codes.csproj -c Release -o out -p:Version="$version"
          else
            dotnet build Boot.Codes.csproj -c Release -o out
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: Boot.Codes
          path: out/Boot.Codes.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Boot.Codes

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Boot.Codes.dll \
            --repo "$GITHUB_REPOSITORY" \
            --title "Boot.Codes $GITHUB_REF_NAME" \
            --generate-notes
