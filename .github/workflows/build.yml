# Builds Boot.Codes.dll and runs the tests.
# Starts on each push, on each pull request, and by hand (Actions -> Build -> Run workflow).
# The DLL is in the run's "Boot.Codes" artifact.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test Boot.Codes.Tests

      - name: Build
        run: dotnet build Boot.Codes.csproj -c Release -o out

      - uses: actions/upload-artifact@v7
        with:
          name: Boot.Codes
          path: out/Boot.Codes.dll
          if-no-files-found: error
